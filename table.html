<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Details Table</title>
    <style>
        h2{
            color:brown;
            text-align:center;
        }
        table{
            width:100%
        }
        table,th,td{
            border: 1px solid lightblue;
            border-collapse: collapse;
        }
        th{
            color:aliceblue;
            text-shadow: 2px 2px darkgreen;
            background-color: brown;
            padding:5px;
        }
        td{
            color:darkblue;
            text-shadow: 2px 2px lightpink;
            padding: 5px;
            text-align: center;
        }

    </style>
</head>
<body>

    <h2>Bank Account Details</h2>
    <table>
