<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <style>
        #header{
            color:darkblue;
            text-shadow: 2px 2px lightgray;
            text-align: center;
            font-family:Georgia, 'Times New Roman', Times, serif;
            background-color: lightseagreen;
        }
        body{
            background-color: lightcyan;
            height: 500px;
            width: 300px;
            padding:4px;
            border: 2px solid darkblue;

        }
        #footer{
            color: darkblue;
            text-align: center;
            background-color: lightseagreen;
        }
        #form{
            text-align: left;
        }
        label{
            font:bold;
            color:black;
            font-family:Georgia, 'Times New Roman', Times, serif;
        }
        input{
        
            border: 1px solid darkcyan;
            background-color:lightgray;
        }
        
    </style>
</head>
<body>
    <div id="header">
        <h2>CONTACT FORM</h2>
    </div>
    <br>
    <form>
    <div id="form">
        <label>Client Name</label>
        <br><br>
        <label for="1name">Frist Name:</label>
        <input type="text" id="1name" name="1name">
        <br>
        <label for="2name">Middle Name:</label>
        <input type="text" id="2name" name="2name">
        <br>
        <label for="3name">Last Name:</label>
        <input type="text" id="3name" name="3name">
        <br><br>
        <label for="pn">Phone Number:</label>
        <input type="number" id="pn" name="pn" placeholder="00000-00000">
        <br><br>
        <label for="eml">E-mail:</label >
        <input type="email" id="eml" name="eml"placeholder="@gmail.com">
        <br><br>
        <label for="ad">Address:</label>
        <input type="text" id="ad" name="ad">
        <br><br>
        <label for="ad2">Comment:</label>
        <input type="text" id="ad2" name="ad2">
        <br><br>
        <input type="checkbox" id="ch" name="ch" value="ch">
        <label for="ch" required>All detail are Rechecked</label>
        <br><br>
        <input type="submit" value="sumbit">

    </div>
    </form>
    <div id="footer">
         <h6>www.contactform.com
         @contactform</h6>
    </div>
    
</body>
</html>
