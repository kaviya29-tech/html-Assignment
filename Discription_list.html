<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Description List</title>
    <style>
        dd{
            color:brown;
            text-decoration:underline;
            /* [overline,underline,line-through] = different styles of text-decoration */
            text-shadow: 2px 2px 5px white;
            /* [horizontal,vertical,blur-radius,color] = different styles of text-shadow.how it works like shadow */
        }
        h4{
            color:gray;
            text-shadow: 2px 2px darkgreen;
            text-transform: uppercase;
        }
        dd{
            text-transform: capitalize;
        }
        body{
            background-color:lightblue;
        }
        p{
            text-transform: capitalize;
        }
    </style>

</head>
<body>
    <h4>Description List</h4>
    <dl>
        <dt>Employers Name list:</dt>
        <dd>Kaviya</dd>
        <dd>Jaison</dd>
        <dd>Dhanaraj</dd>
        <dd>Bavi</dd>
    </dl>
    <p>this is called description list</p>
    
</body>
</html>
