<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block element</title>
</head>
<body>
    
<div style="background-color: lightblue; color: darkblue; padding: 20px; border-radius: 8px; border-left: 5px solid brown; margin-bottom: 20px;">
    <h3>This is a Block-Level Element (div)</h3>
    <p>Block-level elements automatically stack vertically because they occupy the entire width of their parent container.</p>
</div>
    
</body>
</html>
